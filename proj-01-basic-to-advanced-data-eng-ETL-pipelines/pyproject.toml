[project]
name = "basic-to-advanced-etl-pipelines"
version = "0.2.0"
description = "Four practical ETL pipelines with migrations, validation, and freshness monitoring"
requires-python = ">=3.10,<4"
dependencies = [
    "pandas>=2.2,<4",
    "requests>=2.31,<3",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "python-dotenv>=1.0",
    "yfinance>=0.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
